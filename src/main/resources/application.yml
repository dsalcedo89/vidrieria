spring:
  application:
    name: vidrieria-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vidrieria_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true