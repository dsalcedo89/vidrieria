spring:
  application:
    name: vidrieria-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vidrieria_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:CAMBIAR_ESTE_SECRETO_LOCAL_DE_32_BYTES_MINIMO}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
